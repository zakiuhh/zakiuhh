name: Rebuild profile assets

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    paths:
      - "scripts/build_assets.py"

permissions:
  contents: write

concurrency:
  group: rebuild-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build SVGs
        env:
          # Optional: add a classic PAT as a repo secret named GH_PAT to include
          # private contributions in the yearly count. Falls back to the default token.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/build_assets.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data
          git diff --cached --quiet || git commit -m "chore: rebuild profile assets"
          git push
